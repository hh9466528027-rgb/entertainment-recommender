<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101018" />
  <meta name="description" content="Discover your next favorite movie, series, anime, game, novel, comic, or artist with personalized entertainment picks." />
  <title>Entertainment Recommender — Find your next favorite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Entertainment Recommender home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>afterglow<span class="brand-dot">.</span></span>
    </a>
    <div class="header-actions">
      <button class="button button-quiet theme-toggle" id="theme-toggle-btn" type="button" aria-label="Switch theme">☼ Light</button>
      <button class="button button-quiet" id="edit-prefs-btn" type="button" hidden>Edit your taste <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main id="app" class="page-shell" aria-live="off"></main>
  <footer class="site-footer"><span>Made for your next “one more episode.”</span><span>Discover · Decide · Enjoy</span></footer>
  <dialog id="details-dialog" class="detail-dialog" aria-labelledby="detail-title">
    <button class="dialog-close" type="button" aria-label="Close details">×</button>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
